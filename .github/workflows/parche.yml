name: Parche y compilar
on:
  push:
    branches: [main]
    paths: ['parche*.zip']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  parche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche
        run: |
          shopt -s nullglob
          for z in parche*.zip; do
            unzip -o "$z" -d .
            rm "$z"
          done
          if [ -f delete.txt ]; then
            xargs -a delete.txt -r rm -rf
            rm delete.txt
          fi
          git config user.name "parche-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Aplicar parche"
          git push
      - name: Lanzar compilación (Java CI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gradle.yml --ref main
